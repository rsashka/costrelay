<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>{{TITLE}}</title>
<style>

body{font-family:system-ui,sans-serif;margin:0;background:#f7f9fc;color:#172033}
a{color:#1f6feb}
header{padding:18px 28px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center}
main{padding:24px 28px;max-width:1280px;margin:auto}
.cards{display:flex;gap:14px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px;min-width:150px}
.num{font-size:22px;font-weight:700}
.num.err{color:#b42318}
.num.warn{color:#b45309}
.card .more{display:inline-block;margin-top:6px;font-size:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:6px}
.kv b{font-weight:600}
table{border-collapse:collapse;width:100%;background:#fff;margin-top:18px}
th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px;vertical-align:top}
th{background:#f1f5f9}
.muted{color:#64748b}
.err{color:#b42318}
.warn{color:#b45309}
.alert{background:#fef3f2;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:10px;padding:12px 16px;margin:16px 0;color:#7f1d1d}
.alert b{display:block;margin-bottom:6px}
.bar{background:#e2e8f0;border-radius:4px;height:8px;min-width:40px}
.bar>span{display:block;height:8px;border-radius:4px;background:#1f6feb}
header nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header nav a{color:#c7d2fe;font-size:13px;text-decoration:none}
.header-right{display:flex;gap:14px;align-items:center;position:relative}
.menu{position:relative}
.menu-panel{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:#172033;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 18px 40px rgba(15,23,42,.28);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:240px;z-index:200}
.menu-panel[hidden]{display:none}
.menu-panel button{background:#f1f5f9;color:#172033;border:0;border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.menu-panel button:hover{background:#e2e8f0}
.menu-panel .muted{padding:2px 4px;font-size:12px;min-height:16px}
.btn{display:inline-block;background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
h2 .btn{font-size:12px;padding:4px 9px;margin-left:8px}
.btn-small{padding:1px 7px}
.btn[disabled]{opacity:.55;cursor:default}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin:16px 0}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#64748b}
.filters select,.filters input{padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:13px;background:#fff;min-width:140px}
.filters label.check{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:#172033;padding-bottom:7px;cursor:pointer}
.filters label.check input{min-width:0;width:16px;height:16px;margin:0;padding:0}
tr.row-blocked td{background:#fef3f2;color:#7f1d1d}
tr.row-blocked td:first-child{box-shadow:inset 3px 0 0 #dc2626}
.blocked-tag{display:inline-block;margin-left:6px;font-size:11px;color:#b42318;background:#fee4e2;border-radius:6px;padding:1px 6px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
#price-table th[data-sort]{cursor:pointer;white-space:nowrap}
#price-table th[data-sort]:hover{text-decoration:underline}
#blacklist-table input{width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:12px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.table-wrap{overflow-x:auto}
code{background:#f1f5f9;padding:1px 4px;border-radius:4px}

</style>
<meta name="csrf-token" content="{{CSRF}}">
<script>
// Единая точка POST-запросов панели: CSRF, JSON и разбор ошибки.
window.panelPost=async(url,body)=>{
  const meta=document.querySelector('meta[name="csrf-token"]');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',
    'X-CSRF-Token':meta?meta.content:''},body:JSON.stringify(body===undefined?{}:body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return j;
};
window.panelRaw=async(url,contentType,body)=>{
  const meta=document.querySelector('meta[name="csrf-token"]');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':contentType||'text/plain',
    'X-CSRF-Token':meta?meta.content:''},body:body===undefined?'':body});
  return await r.json().catch(()=>({}));
};
</script>
